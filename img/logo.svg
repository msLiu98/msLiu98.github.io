<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#34495e"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1"/>
      <stop offset="100%" style="stop-color:#bdc3c7"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)"/>
  
  <!-- 外圈装饰 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#3498db" stroke-width="2" opacity="0.6"/>
  
  <!-- 字母 T -->
  <text x="100" y="140" 
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
        font-size="120" 
        font-weight="300" 
        text-anchor="middle" 
        fill="url(#letter)">
    T
  </text>
  
  <!-- 底部装饰线 -->
  <rect x="60" y="155" width="80" height="3" rx="1.5" fill="#3498db" opacity="0.8"/>
</svg>
