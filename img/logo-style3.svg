<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- 方形圆角背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad4)"/>
  
  <!-- T 字母 -->
  <g>
    <rect x="60" y="50" width="80" height="20" rx="4" fill="url(#grad5)"/>
    <rect x="90" y="50" width="20" height="100" rx="4" fill="url(#grad5)"/>
  </g>
  
  <!-- 角落装饰 -->
  <circle cx="40" cy="40" r="8" fill="rgba(233,69,96,0.3)"/>
  <circle cx="160" cy="160" r="8" fill="rgba(233,69,96,0.3)"/>
</svg>
